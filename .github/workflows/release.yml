name: Release to BeanCS
run-name: Deploy tag ${{ github.ref_name }}

on:
  push:
    tags: ['**']

permissions:
  contents: read

# Preserve running releases and queue subsequent tags instead of dropping them.
concurrency:
  group: reboot-earth-production
  cancel-in-progress: false
  queue: max

jobs:
  test:
    uses: ./.github/workflows/ci.yml
  release:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: https://reboot.hollowdata.com/data/catalog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Identify the exact tagged commit
        id: source
        shell: bash
        run: |
          printf 'revision=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'image_tag=run-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: registry.beancs.com
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: registry.beancs.com/reboot-earth-proj/backend:${{ steps.source.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/zeturn/reboot-earth-proj
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=reboot-backend
          cache-to: type=gha,scope=reboot-backend,mode=max
      - name: Build and publish frontend
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: NEXT_PUBLIC_API_URL=
          tags: registry.beancs.com/reboot-earth-proj/frontend:${{ steps.source.outputs.image_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/zeturn/reboot-earth-proj
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=reboot-frontend
          cache-to: type=gha,scope=reboot-frontend,mode=max
      - name: Publish BeanCS releases and verify production
        env:
          BEANCS_API_URL: ${{ vars.BEANCS_API_URL }}
          BEANCS_API_KEY: ${{ secrets.BEANCS_API_KEY }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
          SOURCE_TAG: ${{ github.ref_name }}
        run: python -m deploy.beancs
