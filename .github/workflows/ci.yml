name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: reboot_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-ephemeral
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d reboot_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-only-ephemeral@localhost:5432/reboot_ci
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Import data into disposable CI database
        working-directory: backend
        run: python scripts/import_ofo.py
      - name: Backend integration tests (no model calls)
        working-directory: backend
        run: python -m unittest discover -s tests -v
      - name: Deployment safety tests
        run: python -m unittest discover -s deploy/tests -v
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Production frontend build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ''
        run: npm run build
